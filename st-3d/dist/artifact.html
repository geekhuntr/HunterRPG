<title>Instrument Lab 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the 3D viewport is the dominant element (about two thirds of the width on laptops, most of the screen height on phones).
   Name, function and study controls sit beside it (laptop) or beneath it (phone). */
:root {
  --bg: #edf1f3; --surface: #ffffff; --raise: #f4f7f8; --ink: #0d1a24; --muted: #435568; --line: #c2cfd7;
  --accent: #005f7a; --on-accent: #ffffff; --accent-soft: #d5eaf1;
  --ok: #0b6b3a; --ok-soft: #d6f0e0; --bad: #a3191f; --bad-soft: #fbdcdc; --focus: #1a56db;
  --vp-a: #34414c; --vp-b: #0f151a; --vp-ink: #e8eff4;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-disp: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0a1219; --surface: #121f29; --raise: #182733; --ink: #e9f1f6; --muted: #a8bac7; --line: #2b3f4e; --accent: #62cbe8; --on-accent: #04222c; --accent-soft: #12333f; --ok: #6ad59a; --ok-soft: #123a27; --bad: #ff8c88; --bad-soft: #431a1c; --focus: #8ab4ff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0a1219; --surface: #121f29; --raise: #182733; --ink: #e9f1f6; --muted: #a8bac7; --line: #2b3f4e; --accent: #62cbe8; --on-accent: #04222c; --accent-soft: #12333f; --ok: #6ad59a; --ok-soft: #123a27; --bad: #ff8c88; --bad-soft: #431a1c; --focus: #8ab4ff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
#app { max-width: 1320px; margin: 0 auto; padding: 0 16px 40px; }
h1, h2, h3, h4 { font-family: var(--f-disp); margin: 0; line-height: 1.1; text-wrap: balance; } p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0 6px; flex-wrap: wrap; }
.brand { font-family: var(--f-disp); font-weight: 700; font-size: 1.3rem; text-transform: uppercase; letter-spacing: .02em; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.brand b { background: var(--accent); color: var(--on-accent); padding: 0 8px; border-radius: 6px; font-family: var(--f-mono); }
.stat { font-size: .88rem; color: var(--muted); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 10px; }
.tab { flex: none; min-height: 48px; padding: 0 18px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; font-weight: 700; cursor: pointer; }
.tab[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn { min-height: 52px; padding: 10px 18px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; font-weight: 700; cursor: pointer; text-align: center; }
.btn:hover:not(:disabled) { border-color: var(--accent); } .btn:disabled { opacity: .45; cursor: default; }
.btn.sm { min-height: 44px; padding: 6px 12px; font-size: .92rem; } .btn.big { min-height: 60px; font-size: 1.1rem; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ok { border-color: var(--ok); color: var(--ok); } .btn.bad { border-color: var(--bad); color: var(--bad); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.lab { font-family: var(--f-disp); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: .82rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--raise); font-size: .88rem; font-weight: 700; }
.chip.okc { border-color: var(--ok); color: var(--ok); } .btnchip { min-height: 44px; cursor: pointer; padding: 4px 14px; font-size: .95rem; }
.btnchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.q { font-family: var(--f-mono); }

/* stage: viewport + side panel */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }
.vpwrap { position: relative; border-radius: 18px; overflow: hidden; background: radial-gradient(120% 100% at 50% 35%, var(--vp-a), var(--vp-b)); border: 2px solid var(--line); height: clamp(360px, 60vh, 640px); }
@media (min-width: 960px) { .vpwrap { height: calc(100vh - 170px); min-height: 520px; max-height: 820px; } }
.vp { position: absolute; inset: 0; cursor: grab; } .vp:active { cursor: grabbing; }
.vp-hint { position: absolute; top: 12px; left: 14px; right: 150px; color: var(--vp-ink); opacity: .8; font-size: .88rem; pointer-events: none; transition: opacity .4s; } .vp-hint.gone { opacity: 0; }
.vp-reset { position: absolute; top: 10px; right: 10px; background: rgba(15, 21, 26, .75); color: var(--vp-ink); border-color: #51606c; }
.vp-views { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px 12px; background: linear-gradient(transparent, rgba(8, 12, 15, .7)); }
.vp-views.plain { position: static; background: none; padding: 6px 0; }
.vb { flex: none; min-height: 44px; padding: 0 14px; border: 1.5px solid #51606c; background: rgba(15, 21, 26, .75); color: var(--vp-ink); border-radius: 999px; font-weight: 700; cursor: pointer; }
.vp-views.plain .vb { background: var(--surface); color: var(--ink); border-color: var(--line); }
.vb:hover { border-color: #62cbe8; }
.vp-open { position: absolute; left: 14px; bottom: 70px; display: flex; flex-direction: column; gap: 4px; color: var(--vp-ink); font-weight: 700; font-size: .9rem; background: rgba(15, 21, 26, .75); padding: 8px 12px; border-radius: 12px; border: 1.5px solid #51606c; min-width: 190px; }
.vp-open.static { position: static; color: var(--ink); background: var(--surface); border-color: var(--line); }
.vp-open input { width: 100%; height: 32px; accent-color: #62cbe8; }
.side { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 14px; align-content: start; }
.selrow { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; }
.selrow select { min-height: 52px; border: 2px solid var(--line); border-radius: 12px; padding: 0 10px; background: var(--surface); width: 100%; min-width: 0; font-weight: 700; }
.mystery { font-size: 1.9rem; } .name { font-size: 2.1rem; text-transform: uppercase; letter-spacing: .02em; }
.fn { font-size: 1.15rem; line-height: 1.4; }
ul.feat { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; }
.status summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 700; color: var(--accent); }
.status p { font-size: .9rem; margin-top: 4px; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; margin-bottom: 14px; }
.score { font-family: var(--f-disp); font-size: 3.4rem; font-weight: 700; color: var(--accent); line-height: 1; }
.choices { display: grid; gap: 10px; }
.choice { display: flex; gap: 12px; text-align: left; min-height: 58px; padding: 10px 14px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer; font-size: 1.05rem; align-items: center; }
.choice .L { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--raise); border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-size: .9rem; }
.choice.right { border-color: var(--ok); background: var(--ok-soft); } .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; background: var(--raise); } .fb.ok { border-color: var(--ok); } .fb.no { border-color: var(--bad); }
.cmpgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .vpwrap.small { height: clamp(300px, 46vh, 520px); }
@media (max-width: 640px) { .cmpgrid { grid-template-columns: 1fr; } }
.tag { position: absolute; top: 10px; left: 12px; background: rgba(15, 21, 26, .75); color: var(--vp-ink); padding: 2px 12px; border-radius: 999px; font-weight: 700; border: 1.5px solid #51606c; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; } .col { background: var(--raise); border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.tip { background: var(--accent-soft); border-radius: 12px; padding: 12px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; } .check input { width: 22px; height: 22px; accent-color: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.inv { display: grid; gap: 8px; } .invrow { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; } .invrow.ready { border-color: var(--ok); }
.invhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; min-height: 56px; cursor: pointer; align-items: center; }
.invhead .nm { font-weight: 700; font-size: 1.05rem; } .invhead .muted { grid-column: 1 / -1; font-size: .85rem; }
.invbody { padding: 0 14px 14px; display: grid; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>

/* Study engine: no DOM. Prioritisation, alias matching, distractor and question building. */
(function (root) {

  // ---- progress ----
  // prog[id] = { n, c, p, w, box 0..4, last 'c'|'p'|'w' }
  function mark(prog, id, res) {

    t = t.map(w => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w));

/* Allis tissue forceps, standard 15.5 cm (6 in). PROCEDURAL EDUCATIONAL MODEL, not a scan.

   - Seen face-on (ring plane), slender jaws leave a narrow lens-shaped space behind the tips; only the tips meet.
   - Each jaw ends in a short head bent in toward its partner that widens to a ~5.6 mm spade with a small window
     (fenestration) just behind the grasping edge.
   - The grasping edges carry sharp INTERLOCKING teeth: 4 on one jaw, 5 on the other ("4x5"), which mesh when closed.
     A Babcock instead has a smooth, wider (~9 mm) tip bar and wire-loop jaws that bow far apart.

   Sourced: 15-15.5 cm length and 4x5 teeth (WPI 501324, Vet Spectrum SAH.752015, UNICEF S0738000, Spiggle & Theis
   80-400-15 GUDID); tips meet only at the very end with small interlocking teeth; blades straight, becoming triangular

  const SP = { cx: 7.25, rx: 1.35, rz: 0.85, w: 0.3, f: 0.03, t: 0.13 }; // oval jaw: center x, half-length, half-width, band width, face |y|, plate thickness

  }, common);
  ST3D.models['towel-perf'] = towelDef(true);
  ST3D.models['towel-non'] = towelDef(false);

  const tipDir = [Math.cos(HC.al), Math.sin(HC.al)], tipP = [HC.tipX - 0.05, mid(HC.tipX)];

    id: 'hemoclip', recordId: 'hemoclip', build: hemoBuild,

    const q = ID.qs[ID.i], r = byId[q.answer], done = q.chosen !== null;
    const ch = q.choices.map((id, k) => `<button class="choice ${done ? (id === q.answer ? 'right' : k === q.chosen ? 'wrong' : '') : ''}" data-act="idans" data-v="${k}" ${done ? 'disabled' : ''}><span class="L">${'ABCD'[k]}</span><span>${esc(byId[id].name)}</span></button>`).join('');
    const fb = done ? `<div class="fb ${q.choices[q.chosen] === q.answer ? 'ok' : 'no'}" role="status"><h3>${q.choices[q.chosen] === q.answer ? 'Correct' : 'Not quite'}: ${esc(r.name)}</h3><p>${esc(r.fn)}</p><p><b>Look for:</b> ${esc(r.feat[0])}.</p></div><button class="btn pri" data-act="idnext">${ID.i + 1 === ID.qs.length ? 'See score' : 'Next model'}</button>` : '';
    return `<div class="stage"><section class="vpwrap"><div class="vp" id="vp"></div><div class="vp-hint" id="hint">Rotate and zoom to inspect before you answer</div><button class="btn sm vp-reset" data-act="reset">Reset view</button>
        <div class="vp-views">${viewButtons(MODELS[q.m])}</div>${MODELS[q.m].hasArticulation ? `<label class="vp-open"><span>Open / close</span><input type="range" id="open" min="0" max="100" value="0"></label>` : ''}</section>
      <aside class="side"><span class="lab">Identify ${ID.i + 1} / ${ID.qs.length}</span><h2 class="mystery">What is this instrument?</h2><div class="choices">${ch}</div>${fb}</aside></div>`;
  }
  function mountIdentify() {
    if (!$('#vp')) return;
    viewer = new ST3D.Viewer($('#vp'), { preserve: true }); const q = ID.qs[ID.i]; viewer.load(q.m); window.__st3d.viewer = viewer;
    const o = $('#open'); if (o) o.addEventListener('input', () => viewer.setOpen(o.value / 100));
  }

  // ---------- Compare ----------
  const PAIRS = [['allis', 'babcock'], ['kelly', 'crile'], ['mayo-curved', 'metz'], ['mayo-straight', 'mayo-curved'], ['yankauer', 'poole'], ['yankauer', 'frazier'], ['richardson', 'deaver'], ['senn', 'armynavy']];
  const pairModels = p => p.map(r => modelOfRec[r]);
  function viewCompare() {
    const avail = PAIRS.map((p, i) => ({ p, i, ok: pairModels(p).every(Boolean) }));
    const cur = avail[CMP.i] && avail[CMP.i].ok ? avail[CMP.i] : null;
    const tabs = avail.map(a => `<button class="btn sm" data-act="cmp" data-v="${a.i}" aria-pressed="${a.i === CMP.i}" ${a.ok ? '' : 'disabled'}>${esc(byId[a.p[0]].name.replace(/ (hemostat|forceps|scissors.*)$/, ''))} vs ${esc(byId[a.p[1]].name.replace(/ (hemostat|forceps|scissors.*)$/, ''))}${a.ok ? '' : ' (model pending)'}</button>`).join('');
    if (!cur) return `<div class="panel"><h2>Side-by-side comparison</h2><p>Side-by-side 3D comparison needs a finished model for both instruments. ${avail.filter(a => !a.ok).length} comparison pairs are waiting on models.</p><div class="row">${tabs}</div></div>`;
    const [a, b] = cur.p.map(i => byId[i]), card = COMPARES.find(c => c.items.some(it => it.rec === a.id) && c.items.some(it => it.rec === b.id));
    return `<div class="row" style="margin-bottom:10px">${tabs}</div>
      <div class="cmpgrid"><section class="vpwrap small"><div class="vp" id="vp"></div><div class="tag" id="tagA">${CMP.reveal ? esc(a.name) : 'Instrument A'}</div></section>
        <section class="vpwrap small"><div class="vp" id="vp2"></div><div class="tag" id="tagB">${CMP.reveal ? esc(b.name) : 'Instrument B'}</div></section></div>
      <div class="vp-views plain">${viewButtons(MODELS[pairModels(cur.p)[0]])}</div>
      <div class="row" style="margin:8px 0"><label class="check"><input type="checkbox" id="sync" ${CMP.sync ? 'checked' : ''}> Sync both cameras</label><label class="vp-open static"><span>Open / close</span><input type="range" id="open" min="0" max="100" value="0"></label><button class="btn sm" data-act="reset">Reset both</button></div>
      <div class="panel">${CMP.reveal ? `<h3>${esc(a.name)} vs ${esc(b.name)}</h3><div class="cols"><div class="col"><h4>${esc(a.name)}</h4><p>${esc(a.fn)}</p><p><b>Look for:</b> ${esc(a.feat[0])}.</p></div><div class="col"><h4>${esc(b.name)}</h4><p>${esc(b.fn)}</p><p><b>Look for:</b> ${esc(b.feat[0])}.</p></div></div><div class="tip"><b>Quick rule:</b> ${esc(card ? card.practical : (a.conf && a.conf.rec === b.id ? a.conf.diff : ''))}</div><button class="btn sm" data-act="cmphide">Hide names</button>` : `<p>Inspect both models, then reveal which is which and how to tell them apart.</p><button class="btn pri" data-act="cmpreveal">Reveal names and the key difference</button>`}</div>`;
  }
  function mountCompare() {
    const a = $('#vp'), b = $('#vp2'); if (!a) return;
    const pm = pairModels(PAIRS[CMP.i]);
    viewer = new ST3D.Viewer(a, { preserve: true }); viewer2 = new ST3D.Viewer(b, { preserve: true });
    viewer.load(pm[0]); viewer2.load(pm[1]); window.__st3d.viewer = viewer; window.__st3d.viewer2 = viewer2;
    let lock = false;
    const sync = (from, to) => from.controls.addEventListener('change', () => { if (!CMP.sync || lock) return; lock = true; to.camera.position.copy(to.controls.target).add(from.camera.position.clone().sub(from.controls.target).setLength(to.camera.position.distanceTo(to.controls.target) * 0 + from.camera.position.distanceTo(from.controls.target))); to.camera.lookAt(to.controls.target); to.dirty(); lock = false; });
    sync(viewer, viewer2); sync(viewer2, viewer);
    const o = $('#open'); if (o) o.addEventListener('input', () => { viewer.setOpen(o.value / 100); viewer2.setOpen(o.value / 100); });
    const sy = $('#sync'); if (sy) sy.addEventListener('change', () => { CMP.sync = sy.checked; });
  }

  // ---------- Inventory ----------
  const stateOf = r => { const m = modelOfRec[r.id]; return m ? (MODELS[m].status.reviewed ? { k: 'ready', t: '3D model ready', n: MODELS[m].status.note } : { k: 'ready', t: '3D model (review pending)', n: MODELS[m].status.note }) : { k: 'none', t: 'No 3D model yet', n: 'Text details only for now.' }; };
  function viewInventory() {
    const list = RECORDS.filter(r => invTray === 'All' || r.trays.includes(invTray)).sort((a, b) => (modelOfRec[b.id] ? 1 : 0) - (modelOfRec[a.id] ? 1 : 0) || a.name.localeCompare(b.name));
    const per = TRAYS.map(t => { const rs = RECORDS.filter(r => r.trays.includes(t)); return `<span class="chip">${t}: <b>${rs.filter(r => modelOfRec[r.id]).length}</b> of ${rs.length} instruments modeled</span>`; }).join('');
    return `<div class="panel"><h2>Inventory and 3D status</h2><p class="muted">Every instrument from your Minor, Major and D&C lists is here (${ROWS.length} list rows combined into ${RECORDS.length} study records). A model counts as ready only when it is built and reviewed.</p><div class="chips">${per}</div>
      <div class="seg" role="group" aria-label="Tray">${['All', ...TRAYS].map(t => `<button class="btn sm" data-act="invtray" data-v="${esc(t)}" aria-pressed="${invTray === t}">${t}</button>`).join('')}</div></div>
      <div class="inv">${list.map(r => { const s = stateOf(r), open = invOpen[r.id]; return `<div class="invrow ${s.k}"><button class="invhead" data-act="invopen" data-v="${r.id}" aria-expanded="${!!open}"><span class="nm">${esc(r.name)}</span><span class="chip ${s.k === 'ready' ? 'okc' : ''}">${s.t}</span><span class="muted">${r.trays.map(t => t + ' ×' + qty(r, t)).join(' · ')}</span></button>
        ${open ? `<div class="invbody"><p>${esc(r.fn)}</p><ul class="feat">${r.feat.map(f => `<li>${esc(f)}</li>`).join('')}</ul><p class="muted">${esc(s.n)}</p>${s.k === 'ready' ? `<button class="btn sm pri" data-act="openmodel" data-v="${modelOfRec[r.id]}">Open the 3D model</button>` : ''}</div>` : ''}</div>`; }).join('')}</div>`;
  }

  // ---------- events ----------
  const acts = {
    tab: v => { tab = v; try { history.replaceState(null, '', '#' + v); } catch (e) { /* sandbox */ } if (v === 'identify') ID = null; render(); },
    theme: () => { S.theme = { system: 'light', light: 'dark', dark: 'system' }[S.theme]; applyTheme(); save(); },
    view: v => { viewer.view(v); if (viewer2) viewer2.view(v); },
    reset: () => { const o = $('#open'); if (o) o.value = 0; openK = 0; viewer.reset(); if (viewer2) viewer2.reset(); activePart = null; if (tab === 'inspect') refreshSide(); },
    reveal: () => { revealed = true; refreshSide(); },
    hide: () => { revealed = false; refreshSide(); },
    part: v => { activePart = activePart === v ? null : v; viewer.highlight(activePart); if (activePart) { const m = MODELS[S.sel]; const map = { rings: 'rings', shanks: 'front', box: 'box', ratchet: 'ratchet', jaws: 'jaws' }; if (m.partViews && m.partViews[v]) viewer.view(m.partViews[v]); else if (m.views[map[v]]) viewer.view(map[v]); } refreshSide(); },
    know: () => { E.mark(S.prog, recOfModel(S.sel).id, 'c'); save(); acts.next(); },
    again: () => { E.mark(S.prog, recOfModel(S.sel).id, 'w'); save(); acts.next(); },
    next: () => step(1), prev: () => step(-1),
    idans: v => { const q = ID.qs[ID.i]; if (q.chosen !== null) return; q.chosen = +v; const ok = q.choices[q.chosen] === q.answer; E.mark(S.prog, q.answer, ok ? 'c' : 'w'); save(); if (ok) ID.score++; keepView(); },
    idnext: () => { if (ID.i + 1 >= ID.qs.length) ID.done = true; else ID.i++; render(); },
    idnew: () => { ID = null; render(); },
    cmp: v => { CMP.i = +v; CMP.reveal = false; render(); }, cmpreveal: () => { CMP.reveal = true; render(); }, cmphide: () => { CMP.reveal = false; render(); },
    invtray: v => { invTray = v; render(); }, invopen: v => { invOpen[v] = !invOpen[v]; render(); },
    openmodel: v => { S.sel = v; save(); revealed = false; tab = 'inspect'; render(); }
  };
  // re-render the side panel of the identify tab without resetting the 3D camera
  function keepView() { const side = $('.side'); const tmp = document.createElement('div'); tmp.innerHTML = viewIdentify(); const ns = tmp.querySelector('.side'); if (side && ns) side.innerHTML = ns.innerHTML; }
  function step(d) { const ids = modelIds(); let i = ids.indexOf(S.sel); i = (i + d + ids.length) % ids.length; if (tab === 'inspect') switchModel(ids[i]); else { S.sel = ids[i]; render(); } }
  app.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = acts[el.dataset.act]; if (f) f(el.dataset.v, el); });
  app.addEventListener('change', e => { if (e.target.id === 'sel') switchModel(e.target.value); });
  document.addEventListener('keydown', e => { if (e.target.matches && e.target.matches('input, select, textarea')) return; if (tab === 'inspect' && viewer) { if (e.key === 'r') acts.reset(); } });

  window.__st3d = { get S() { return S; }, MODELS, byId, RECORDS, ROWS, acts, get tab() { return tab; } };
  applyTheme(); render();
})();

</script>
